name: refresh mirror

# Runs a day after the weekly measurement is published, so the fresh release is
# always in place by the time the mirror looks for it. GitHub does the refresh
# itself: no credentials are needed anywhere outside this repository.
on:
  schedule:
    - cron: "10 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest datasets from the canonical domains
        run: python scripts/fetch_latest.py
      - name: Commit if anything changed
        run: |
          git config user.name "aiv-mirror-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "mirror: refresh datasets from dabyte.ai and dablock.ai"
          git push
